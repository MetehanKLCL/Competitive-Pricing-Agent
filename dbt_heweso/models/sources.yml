version: 2

sources:
  - name: bronze
    description: >
      Bronze katmanı — DynamoDB'den export_to_s3.py ile export edilen ham veri.
      Bu tablolar setup_glue_tables.py ile önceden oluşturuldu, dbt bunları
      SADECE OKUR, hiç değiştirmez veya yeniden oluşturmaz.
    database: awsdatacatalog
    schema: heweso_analytics
    tables:
      - name: bronze_sales
        description: "Ham satış kayıtları, Hive partition: date=YYYY-MM-DD"
      - name: bronze_audit
        description: "Ham audit log — agent'ın attığı her aksiyon (fiyat değişimi, escalation, vs.)"
      - name: bronze_competitors
        description: "Ham rakip fiyat kayıtları"
      - name: bronze_products
        description: "Ham ürün bilgisi (mevcut fiyat, min/base fiyat, bundle ilişkileri)"
