version: 2

sources:
  - name: bronze
    description: >
      Bronze layer — raw data exported from DynamoDB by export_to_s3.py.
      These tables were created ahead of time by setup_glue_tables.py; dbt
      only READS them, and never alters or recreates them.
    database: awsdatacatalog
    schema: heweso_analytics
    tables:
      - name: bronze_sales
        description: "Raw sales records, Hive partition: date=YYYY-MM-DD"
      - name: bronze_audit
        description: "Raw audit log — every action the agent took (price change, escalation, etc.)"
      - name: bronze_competitors
        description: "Raw competitor price records"
      - name: bronze_products
        description: "Raw product info (current price, min/base price, bundle relationships)"
