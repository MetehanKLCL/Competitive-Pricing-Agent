version: 2

models:
  - name: silver_sales_enriched
    description: "Sales data enriched with product info; only today's Bronze data is processed."
    columns:
      - name: sale_id
        description: "Unique identifier for each sale"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "ID of the product sold — must be one of the 4 real products"
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('bronze', 'bronze_products')
                field: product_id

  - name: silver_price_actions
    description: >
      Price actions filtered from the audit log. A data-quality gate is applied:
      if product_id does not belong to a real product (e.g. UNKNOWN), the row never
      enters this table.
    columns:
      - name: product_id
        description: "The repriced product — always a valid product thanks to the quality gate"
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('bronze', 'bronze_products')
                field: product_id
      - name: direction
        description: "Whether the price moved DOWN, UP, or SAME"
        tests:
          - accepted_values:
              arguments:
                values: ['UP', 'DOWN', 'SAME']

  - name: silver_competitor_gaps
    description: "The gap between competitor prices and ours, per product and competitor."
    columns:
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('bronze', 'bronze_products')
                field: product_id
