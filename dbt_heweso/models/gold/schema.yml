version: 2

models:
  - name: gold_daily_product_metrics
    description: "DAILY sales + price summary per product (event-date based). The report/dashboard reads from here."
    columns:
      - name: date
        description: "Event date (the day the sale/action actually happened, not the snapshot date)"
        tests:
          - not_null
      - name: product_id
        description: "Product ID — (date, product_id) is unique; see tests/assert_gold_daily_metrics_unique.sql"
        tests:
          - not_null

  - name: gold_agent_performance
    description: "The agent's DAILY decision quality — how many discounts, bundles, escalations (event-date based)."
    columns:
      - name: date
        description: "The action's real event date"
        tests:
          - not_null
      - name: product_id
        description: "Product ID — (date, product_id) is unique; see tests/assert_gold_agent_performance_unique.sql"
        tests:
          - not_null

  - name: gold_bundle_effectiveness
    description: "The effect of bundle discounts (epsilon-greedy) on sales (event-date based)."
    columns:
      - name: date
        description: "The bundle action's real event date"
        tests:
          - not_null
      - name: product_id
        description: "Product ID — (date, product_id) is unique; see tests/assert_gold_bundle_effectiveness_unique.sql"
        tests:
          - not_null
